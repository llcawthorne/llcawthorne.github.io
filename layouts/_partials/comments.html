<div class="giscus"></div>
<script>
  (function () {
    var container = document.querySelector(".giscus");
    var script = document.createElement("script");
    script.src = "https://giscus.app/client.js";
    script.setAttribute("data-repo", "{{ site.Params.giscus.repo }}");
    script.setAttribute("data-repo-id", "{{ site.Params.giscus.repoId }}");
    script.setAttribute("data-category", "{{ site.Params.giscus.category }}");
    script.setAttribute("data-category-id", "{{ site.Params.giscus.categoryId }}");
    script.setAttribute("data-mapping", "pathname");
    script.setAttribute("data-strict", "0");
    script.setAttribute("data-reactions-enabled", "1");
    script.setAttribute("data-emit-metadata", "0");
    script.setAttribute("data-input-position", "bottom");
    script.setAttribute("data-theme", document.documentElement.dataset.theme === "dark" ? "dark" : "light");
    script.setAttribute("data-lang", "en");
    script.setAttribute("crossorigin", "anonymous");
    script.async = true;
    container.appendChild(script);

    var themeToggle = document.getElementById("theme-toggle");
    if (themeToggle) {
      themeToggle.addEventListener("click", function () {
        setTimeout(function () {
          var iframe = document.querySelector("iframe.giscus-frame");
          if (!iframe) return;
          iframe.contentWindow.postMessage(
            {
              giscus: {
                setConfig: {
                  theme: document.documentElement.dataset.theme === "dark" ? "dark" : "light",
                },
              },
            },
            "https://giscus.app"
          );
        }, 0);
      });
    }
  })();
</script>
