baseURL = 'https://llcawthorne.github.io/'
locale = 'en-us'
title = "Senior Software Engineer Learns Functional Programming"
theme = "PaperMod"
pygmentsUseClasses = true
paginate = 10
titleCaseStyle = "none"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

[outputs]
  home = ["HTML", "RSS", "JSON"]

[taxonomies]
  tag = "tags"

[params]
  author = "Lewis Cawthorne"
  description = "Notes from Lewis"
  defaultTheme = "dark"
  disableThemeToggle = false
  ShowReadingTime = true
  ShowWordCount = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowShareButtons = false
  ShowToc = true
  displayFullLangName = true

  [params.homeInfoParams]
    Title = "Senior Software Engineer Learns Functional Programming"
    Content = "With explorations in Haskell, Elixir, and Clojure. Plus book reviews, side project notes, and occasional dives into different web frameworks."

  [params.footer]
    text = "[Subscribe via RSS](/index.xml)"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/llcawthorne"

